<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-label="A process chain runs a list of steps on a session as one undo step" font-family="system-ui, Segoe UI, sans-serif" font-size="12"><rect width="640" height="262" rx="6" fill="#26262c"/><rect x="16" y="36" width="230" height="170" rx="3" fill="#32323a" opacity="1"/><text x="28" y="56" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">my-episode-chain</text><rect x="28" y="66" width="206" height="22" rx="3" fill="#26262c" opacity="1"/><text x="38" y="82" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">1  Auto Mic Mix</text><rect x="28" y="93" width="206" height="22" rx="3" fill="#26262c" opacity="1"/><text x="38" y="109" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">2  Close Dead Space</text><rect x="28" y="120" width="206" height="22" rx="3" fill="#26262c" opacity="1"/><text x="38" y="136" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">3  Voice Chain Preset</text><rect x="28" y="147" width="206" height="22" rx="3" fill="#26262c" opacity="1"/><text x="38" y="163" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">4  QuickPass</text><rect x="28" y="174" width="206" height="22" rx="3" fill="#26262c" opacity="1"/><text x="38" y="190" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">5  Loudness Target</text><line x1="246" y1="120" x2="330" y2="120" stroke="#5a9a6b" stroke-width="1.5"/><polygon points="330.0,120.0 323.7,123.0 323.7,117.0" fill="#5a9a6b"/><text x="288" y="108" fill="#5a9a6b" text-anchor="middle" font-size="10" font-weight="400">Run Process Chain</text><rect x="334" y="36" width="290" height="170" rx="3" fill="#32323a" opacity="1"/><text x="346" y="56" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Your session</text><rect x="346" y="68" width="266" height="26" rx="3" fill="#3d7ab8" opacity="0.6"/><rect x="346" y="102" width="266" height="26" rx="3" fill="#a86fb0" opacity="0.6"/><rect x="346" y="136" width="266" height="26" rx="3" fill="#3d7ab8" opacity="0.6"/><text x="16" y="232" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">The chain is checked before anything changes. A step that is unknown or out of range stops it with a message.</text><text x="16" y="250" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">A step that fails takes back what already ran, unless the chain marks it to be skipped.</text></svg>