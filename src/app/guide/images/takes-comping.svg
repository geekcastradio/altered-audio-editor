<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Comping takes: pick the best part of each take with a time selection" font-family="system-ui, Segoe UI, sans-serif" font-size="12"><rect width="640" height="300" rx="6" fill="#26262c"/><text x="16" y="22" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Three takes of one line, only one plays at a time</text><rect x="16" y="40" width="608" height="32" rx="3" fill="#32323a" opacity="1"/><text x="24" y="60" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Take 1</text><rect x="70" y="44" width="548" height="24" rx="3" fill="#3d7ab8" opacity="0.35"/><rect x="16" y="78" width="608" height="32" rx="3" fill="#32323a" opacity="1"/><text x="24" y="98" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Take 2</text><rect x="70" y="82" width="548" height="24" rx="3" fill="#a86fb0" opacity="0.35"/><rect x="16" y="116" width="608" height="32" rx="3" fill="#32323a" opacity="1"/><text x="24" y="136" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Take 3</text><rect x="70" y="120" width="548" height="24" rx="3" fill="#5a9a6b" opacity="0.35"/><rect x="250" y="34" width="150" height="118" rx="0" fill="#d9a441" opacity="0.18"/><text x="325" y="168" fill="#d9a441" text-anchor="middle" font-size="10" font-weight="400">time selection</text><text x="16" y="196" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Use over selection on Take 2</text><rect x="16" y="206" width="608" height="32" rx="3" fill="#32323a" opacity="1"/><text x="24" y="226" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Playing</text><rect x="70" y="210" width="180" height="24" rx="3" fill="#3d7ab8" opacity="0.95"/><rect x="250" y="210" width="150" height="24" rx="3" fill="#a86fb0" opacity="0.95"/><rect x="400" y="210" width="218" height="24" rx="3" fill="#3d7ab8" opacity="0.95"/><text x="160" y="226" fill="#d8d8de" text-anchor="middle" font-size="10" font-weight="400">Take 1</text><text x="325" y="226" fill="#d8d8de" text-anchor="middle" font-size="10" font-weight="400">Take 2</text><text x="509" y="226" fill="#d8d8de" text-anchor="middle" font-size="10" font-weight="400">Take 1</text><text x="16" y="262" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">The editor cuts the takes at the edges of the selection and switches which one plays, as one undo step.</text><text x="16" y="280" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">Flatten turns the result into ordinary clips. Open Window &gt; Takes to see each set.</text></svg>