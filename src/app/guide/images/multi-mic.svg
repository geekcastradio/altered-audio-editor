<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Two mics hear both people; Reduce Bleed and Auto Mic Mix tidy it" font-family="system-ui, Segoe UI, sans-serif" font-size="12"><rect width="640" height="300" rx="6" fill="#26262c"/><text x="16" y="22" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Host mic and Guest mic, recorded together</text><rect x="16" y="32" width="608" height="62" rx="3" fill="#32323a" opacity="1"/><rect x="16" y="100" width="608" height="62" rx="3" fill="#32323a" opacity="1"/><text x="24" y="48" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Host mic</text><text x="24" y="116" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Guest mic</text><rect x="70" y="40" width="150" height="38" rx="3" fill="#3d7ab8" opacity="0.95"/><rect x="70" y="108" width="150" height="38" rx="3" fill="#a86fb0" opacity="0.28"/><rect x="240" y="40" width="110" height="38" rx="3" fill="#3d7ab8" opacity="0.28"/><rect x="240" y="108" width="110" height="38" rx="3" fill="#a86fb0" opacity="0.95"/><rect x="380" y="40" width="120" height="38" rx="3" fill="#3d7ab8" opacity="0.95"/><rect x="380" y="108" width="120" height="38" rx="3" fill="#a86fb0" opacity="0.28"/><rect x="520" y="40" width="98" height="38" rx="3" fill="#3d7ab8" opacity="0.28"/><rect x="520" y="108" width="98" height="38" rx="3" fill="#a86fb0" opacity="0.95"/><text x="16" y="176" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">Faint blocks are the other voice leaking into this mic.</text><text x="16" y="192" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">Reduce Bleed takes it out of the copy; your originals stay as they are.</text><text x="16" y="212" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Auto Mic Mix writes a volume lane on each mic that dips while someone else speaks</text><rect x="16" y="222" width="608" height="34" rx="3" fill="#32323a" opacity="1"/><rect x="16" y="262" width="608" height="32" rx="3" fill="#32323a" opacity="1"/><polyline points="16,230 240,230 246,246 344,246 350,230 520,230 526,246 612,246 618,230 624,230" fill="none" stroke="#5a9a6b" stroke-width="2"/><polyline points="16,270 70,270 76,286 214,286 220,270 380,270 386,286 494,286 500,270 624,270" fill="none" stroke="#5a9a6b" stroke-width="2"/><text x="624" y="214" fill="#9a9aa6" text-anchor="end" font-size="10" font-weight="400">Host lane</text></svg>