<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Moving a control while playing records automation you can edit" font-family="system-ui, Segoe UI, sans-serif" font-size="12"><rect width="640" height="230" rx="6" fill="#26262c"/><text x="16" y="22" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Set the track to Write, Latch or Touch, press play, move the volume slider</text><rect x="16" y="34" width="150" height="160" rx="3" fill="#32323a" opacity="1"/><text x="28" y="56" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Voice track</text><rect x="28" y="66" width="60" height="22" rx="3" fill="#26262c" stroke="#5a9a6b" stroke-width="1" opacity="1"/><text x="58" y="81" fill="#5a9a6b" text-anchor="middle" font-size="11" font-weight="400">Write</text><rect x="28" y="96" width="60" height="22" rx="3" fill="#26262c" stroke="#d9a441" stroke-width="1" opacity="1"/><text x="58" y="111" fill="#d9a441" text-anchor="middle" font-size="11" font-weight="400">Latch</text><rect x="28" y="126" width="60" height="22" rx="3" fill="#26262c" stroke="#a86fb0" stroke-width="1" opacity="1"/><text x="58" y="141" fill="#a86fb0" text-anchor="middle" font-size="11" font-weight="400">Touch</text><rect x="176" y="34" width="448" height="160" rx="3" fill="#32323a" opacity="1"/><text x="188" y="52" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Volume lane</text><polyline points="188,150 250,150 290,90 350,70 400,120 460,110 520,60 612,60" fill="none" stroke="#5a9a6b" stroke-width="2"/><circle cx="250" cy="150" r="4" fill="#5a9a6b"/><circle cx="290" cy="90" r="4" fill="#5a9a6b"/><circle cx="350" cy="70" r="4" fill="#5a9a6b"/><circle cx="400" cy="120" r="4" fill="#5a9a6b"/><circle cx="460" cy="110" r="4" fill="#5a9a6b"/><circle cx="520" cy="60" r="4" fill="#5a9a6b"/><line x1="330" y1="40" x2="330" y2="186" stroke="#e0555c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="334" y="184" fill="#e0555c" text-anchor="start" font-size="10" font-weight="400">playhead</text><text x="16" y="216" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">The moves become points on a line you can drag, add or delete afterwards.</text></svg>