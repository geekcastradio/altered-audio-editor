<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Sync lock keeps tracks in step during ripple edits" font-family="system-ui, Segoe UI, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="640" height="300" rx="6" fill="#26262c"/><text x="16" y="22" fill="#9a9aa6" text-anchor="start" font-size="12" font-weight="400">Delete the pause in Voice with Ripple Delete</text><text x="16" y="52" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Sync Lock off on Music</text><text x="624" y="52" fill="#e0555c" text-anchor="end" font-size="11" font-weight="400">Music no longer lines up</text><rect x="16" y="62" width="608" height="76" rx="3" fill="#32323a" stroke="none" opacity="1"/><text x="24" y="80" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Voice</text><text x="24" y="118" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Music</text><rect x="70" y="68" width="150" height="24" rx="3" fill="#3d7ab8" stroke="none" opacity="1"/><rect x="220" y="68" width="160" height="24" rx="3" fill="#3d7ab8" stroke="none" opacity="1"/><rect x="70" y="106" width="150" height="24" rx="3" fill="#a86fb0" stroke="none" opacity="1"/><rect x="300" y="106" width="160" height="24" rx="3" fill="#a86fb0" stroke="none" opacity="1"/><line x1="300" y1="66" x2="300" y2="130" stroke="#e0555c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="16" y="172" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">Sync Lock on for both</text><text x="624" y="172" fill="#5a9a6b" text-anchor="end" font-size="11" font-weight="400">Both tracks stay in step</text><rect x="16" y="182" width="608" height="76" rx="3" fill="#32323a" stroke="none" opacity="1"/><text x="24" y="200" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Voice</text><text x="24" y="238" fill="#9a9aa6" text-anchor="start" font-size="10" font-weight="400">Music</text><rect x="70" y="188" width="150" height="24" rx="3" fill="#3d7ab8" stroke="none" opacity="1"/><rect x="220" y="188" width="160" height="24" rx="3" fill="#3d7ab8" stroke="none" opacity="1"/><rect x="70" y="226" width="150" height="24" rx="3" fill="#a86fb0" stroke="none" opacity="1"/><rect x="220" y="226" width="160" height="24" rx="3" fill="#a86fb0" stroke="none" opacity="1"/><line x1="220" y1="186" x2="220" y2="250" stroke="#5a9a6b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="16" y="282" fill="#9a9aa6" text-anchor="start" font-size="12" font-weight="400">Turn it on with the chain-link button in the track header.</text></svg>
