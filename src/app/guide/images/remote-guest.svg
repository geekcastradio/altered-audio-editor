<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="A double-ender: each person records locally, then the files are synced and cleaned" font-family="system-ui, Segoe UI, sans-serif" font-size="12"><rect width="640" height="320" rx="6" fill="#26262c"/><text x="16" y="22" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">During the call</text><text x="380" y="22" fill="#d8d8de" text-anchor="start" font-size="12" font-weight="600">After the call, in your session</text><rect x="16" y="40" width="110" height="44" rx="3" fill="#32323a" opacity="1"/><text x="71.0" y="66.0" fill="#d8d8de" text-anchor="middle" font-size="12" font-weight="600">Your mic</text><rect x="150" y="40" width="150" height="44" rx="3" fill="#32323a" opacity="1"/><text x="225.0" y="60.0" fill="#d8d8de" text-anchor="middle" font-size="12" font-weight="600">Your file</text><text x="225.0" y="75.0" fill="#9a9aa6" text-anchor="middle" font-size="10" font-weight="400">records on your computer</text><rect x="16" y="150" width="110" height="44" rx="3" fill="#32323a" opacity="1"/><text x="71.0" y="176.0" fill="#d8d8de" text-anchor="middle" font-size="12" font-weight="600">Guest mic</text><rect x="150" y="150" width="150" height="44" rx="3" fill="#32323a" opacity="1"/><text x="225.0" y="170.0" fill="#d8d8de" text-anchor="middle" font-size="12" font-weight="600">Guest file</text><text x="225.0" y="185.0" fill="#9a9aa6" text-anchor="middle" font-size="10" font-weight="400">records on their computer</text><line x1="126" y1="62" x2="150" y2="62" stroke="#9a9aa6" stroke-width="1.5"/><polygon points="150.0,62.0 143.7,65.0 143.7,59.0" fill="#9a9aa6"/><line x1="126" y1="172" x2="150" y2="172" stroke="#9a9aa6" stroke-width="1.5"/><polygon points="150.0,172.0 143.7,175.0 143.7,169.0" fill="#9a9aa6"/><rect x="16" y="100" width="284" height="34" rx="3" fill="#26262c" stroke="#9a9aa6" stroke-width="1" stroke-dasharray="5 4" opacity="1"/><text x="158" y="121" fill="#9a9aa6" text-anchor="middle" font-size="11" font-weight="400">You talk over any call tool</text><line x1="300" y1="172" x2="372" y2="172" stroke="#5a9a6b" stroke-width="1.5"/><polygon points="372.0,172.0 365.7,175.0 365.7,169.0" fill="#5a9a6b"/><text x="336" y="190" fill="#5a9a6b" text-anchor="middle" font-size="10" font-weight="400">file sent</text><rect x="380" y="40" width="244" height="36" rx="3" fill="#3d7ab8" opacity="0.9"/><text x="392" y="63" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="600">Host</text><rect x="380" y="84" width="244" height="36" rx="3" fill="#a86fb0" opacity="0.9"/><text x="392" y="107" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="600">Guest (second track)</text><rect x="380" y="134" width="244" height="26" rx="3" fill="#32323a" opacity="1"/><text x="392" y="151" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">1  Sync Tracks lines the guest up</text><rect x="380" y="166" width="244" height="26" rx="3" fill="#32323a" opacity="1"/><text x="392" y="183" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">2  Reduce Bleed (if one mic heard both)</text><rect x="380" y="198" width="244" height="26" rx="3" fill="#32323a" opacity="1"/><text x="392" y="215" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">3  Auto Mic Mix and Talk Time</text><rect x="380" y="230" width="244" height="26" rx="3" fill="#32323a" opacity="1"/><text x="392" y="247" fill="#d8d8de" text-anchor="start" font-size="11" font-weight="400">4  Close Dead Space</text><text x="16" y="252" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">The guest file is clean, so it sounds better than the call.</text><text x="16" y="270" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">Keep the call recording as a backup for Sync Tracks to line up against.</text><text x="16" y="288" fill="#9a9aa6" text-anchor="start" font-size="11" font-weight="400">Nothing is sent over the network by the program.</text></svg>