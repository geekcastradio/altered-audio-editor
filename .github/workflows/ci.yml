name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its older run. Pushes to main
# always run to the end, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: npm run check

      - name: Frontend tests
        run: npm test

      # The Rust build embeds the built frontend, so build it first.
      - name: Build frontend
        run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # Linux CI is added before public release (see CLAUDE.md).

  security:
    name: Security and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Privacy guard (no network, tracking or accounts)
        run: node scripts/check-privacy.mjs

      - name: npm audit (known vulnerabilities)
        run: npm audit --audit-level=moderate

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (known vulnerabilities)
        working-directory: src-tauri
        run: cargo audit
