name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its older run. Pushes to main
# always run to the end, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: npm run check

      - name: Frontend tests
        run: npm test

      # The Rust build embeds the built frontend, so build it first.
      - name: Build frontend
        run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

  # The ASIO driver code only compiles on Windows with LLVM and the ASIO
  # SDK (fetched by cpal's build script), so it gets its own job.
  windows-asio:
    name: Windows ASIO build
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: asio

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Without this, a cached build skips cpal's SDK download, so a change
      # to the SDK would pass here and break the release build.
      - name: Fetch the ASIO SDK
        uses: ./.github/actions/asio-sdk

      - name: cargo clippy with ASIO
        working-directory: src-tauri
        run: cargo clippy --all-targets --features asio -- -D warnings

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Every fixture test links its own binary, so a debug build is big and the linker
      # has died with a bus error when the runner's disk filled. Clear tools this job
      # never uses first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No recommended extras (ffmpeg alone pulls in a large tree) and no prompts a
      # runner could wait on. The runner's mirror is sometimes slow, so the install
      # retries (see the loop) and the step still fails after 25 minutes at most.
      - name: Install system libraries
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Slow or stalled mirrors have cost whole runs: each attempt is capped, a stalled
          # connection is dropped after 30 seconds, and the later attempts use Azure's mirror.
          use_azure() {
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          }
          for attempt in 1 2 3; do
            if [ "$attempt" -ge 2 ]; then use_azure; fi
            sudo dpkg --configure -a || true
            if sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo timeout 330 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf flac ffmpeg; then
              exit 0
            fi
            echo "Attempt $attempt of 3 did not finish; trying again."
            sleep 10
          done
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # With flac and ffprobe installed, the export test also runs the files
      # through them. Required here, so a missing tool fails instead of skipping.
      - name: cargo test
        working-directory: src-tauri
        env:
          AAE_REQUIRE_TOOLS: "1"
        run: cargo test --workspace

      # The optional pure-Rust AAC encoder (off in release builds). Same checks, with
      # ffmpeg in the tests as the independent decoder.
      - name: cargo clippy with pure-aac
        working-directory: src-tauri
        run: cargo clippy --all-targets --features pure-aac -- -D warnings

      - name: cargo test with pure-aac
        working-directory: src-tauri
        env:
          AAE_REQUIRE_TOOLS: "1"
        run: cargo test --lib --features pure-aac

  security:
    name: Security and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Privacy guard (no network, tracking or accounts)
        run: node scripts/check-privacy.mjs

      # The gate is what ships. Build and test tools (vite, vitest, svelte-check)
      # never reach the installed app, so their advisories are reported in the
      # next step without failing the run. Drop that step's continue-on-error
      # once a fixed release exists.
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      - name: npm audit (build and test tools, informational)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (known vulnerabilities)
        working-directory: src-tauri
        run: cargo audit

  # The macOS video decoder is written but has not been built on a Mac yet, so
  # this job only reports. It does not hold up a pull request.
  macos-video:
    name: macOS video (informational)
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-video

      - name: cargo clippy (macOS video decoder)
        working-directory: src-tauri
        run: cargo clippy -p altered-os-video --features apple --all-targets -- -D warnings

      - name: cargo test (macOS video decoder)
        working-directory: src-tauri
        run: cargo test -p altered-os-video --features apple

