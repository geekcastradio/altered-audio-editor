# Builds the Windows installer and a portable zip when a version tag is
# pushed (git tag v0.1.0 && git push origin v0.1.0). It makes a DRAFT
# release, so nothing is public until you review and publish it.
# Linux and macOS builds are experimental: they are added to the same
# draft afterwards, and if one fails the Windows files are still there.
# The macOS build is not signed or notarized (no Apple developer account).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # ASIO needs LLVM (preinstalled on the runner) and the ASIO SDK,
      # which cpal's build script downloads. If that build fails, the
      # release still ships without ASIO.
      - name: Build installer (with ASIO)
        id: asio
        continue-on-error: true
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run tauri build -- --features asio

      - name: Build installer (without ASIO)
        if: steps.asio.outcome != 'success'
        run: npm run tauri build

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path out, portable | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/Altered-Audio-Editor-$tag-setup.exe"
          Copy-Item src-tauri/target/release/altered-audio-editor.exe "portable/Altered Audio Editor.exe"
          Copy-Item LICENSE, README.md portable/
          Compress-Archive -Path portable/* -DestinationPath "out/Altered-Audio-Editor-$tag-portable.zip"
          Push-Location out
          Get-ChildItem | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
          Pop-Location

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pre = @()
          if ($tag -like "v0.*") { $pre = @("--prerelease") }
          gh release create $tag --draft @pre --title "Altered Audio Editor $tag" --generate-notes (Get-ChildItem out/* | ForEach-Object FullName)

  linux:
    name: Linux AppImage and deb (experimental)
    needs: windows
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- --bundles appimage,deb

      - name: Add to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          mkdir out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/Altered-Audio-Editor-$tag-linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/Altered-Audio-Editor-$tag-linux-amd64.deb"
          (cd out && sha256sum * > SHA256SUMS-linux.txt)
          gh release upload "$tag" out/* --clobber

  macos:
    name: macOS Apple silicon (experimental, unsigned)
    needs: windows
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # "-" means an ad hoc signature: no Apple account, no notarization.
      # Apple silicon needs at least this to run the app at all.
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles app,dmg

      - name: Add to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          mkdir out
          cp src-tauri/target/release/bundle/dmg/*.dmg "out/Altered-Audio-Editor-$tag-macos-arm64.dmg"
          (cd out && shasum -a 256 * > SHA256SUMS-macos.txt)
          gh release upload "$tag" out/* --clobber
