# Builds the Windows installer and a portable zip when a version tag is
# pushed (git tag v0.1.0 && git push origin v0.1.0). It makes a DRAFT
# release, so nothing is public until you review and publish it. Publishing
# makes it the Latest release, which is where the in-app updater looks.
# Each platform builds in its own job and hands its files over as a build
# artifact; the last job makes the draft with everything that built.
# Linux and macOS are experimental: if one fails, the draft still gets
# the Windows files. The macOS build is not signed or notarized (no Apple
# developer account). Files are staged in the runner's temp folder, never
# in the repository, so nothing old from the checkout can slip in.
# The first job checks that the tag matches the version in the files, so a tag
# made before the version bump stops here instead of shipping the old version.

name: Release

on:
  push:
    tags: ["v*"]
  # Start a build without making a tag first: Actions, Release, Run workflow, type the
  # version (for example 0.44.0). The draft release it makes carries the tag name, and the
  # tag itself is created on main when you publish the draft.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.44.0 (must match the version files on main)"
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches the version in the files
    runs-on: ubuntu-24.04
    outputs:
      proceed: ${{ steps.exists.outputs.proceed }}
    steps:
      # Publishing a draft made by a manual start creates the tag, and that tag push would start
      # a second build of the same version. If a published release for this tag already exists,
      # this is that second start: stop here and build nothing.
      - name: Skip a tag push that already has a release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proceed=true
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists, so this tag push builds nothing."
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Manual starts only build main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch."
          exit 1

      - name: Check the tag
        if: steps.exists.outputs.proceed == 'true'
        run: node scripts/check-release-version.mjs "${{ env.TAG }}"

  windows:
    name: Windows installer and portable zip
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # ASIO needs LLVM (preinstalled on the runner) and the ASIO SDK.
      # The SDK is fetched here and located by its contents, because cpal's
      # own download assumes a folder name. If this or the build fails, the
      # release still ships without ASIO, and the draft says so.
      - name: Fetch the ASIO SDK
        continue-on-error: true
        uses: ./.github/actions/asio-sdk

      - name: Build installer (with ASIO)
        id: asio
        continue-on-error: true
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run tauri build -- --features asio

      - name: Build installer (without ASIO)
        if: steps.asio.outcome != 'success'
        run: npm run tauri build

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}"
          $out = Join-Path $env:RUNNER_TEMP "release"
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $out, $portable | Out-Null
          # Only the installer for this tag's version. An older one left in the build cache
          # must never be packaged under a new tag.
          $ver = $tag.TrimStart("v")
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${ver}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer for version $ver in the build output, so the build does not carry this version." }
          Copy-Item $setup.FullName (Join-Path $out "Altered-Audio-Editor-$tag-setup.exe")
          # The signature the in-app updater checks (made because createUpdaterArtifacts is on).
          $sig = "$($setup.FullName).sig"
          if (Test-Path $sig) { Copy-Item $sig (Join-Path $out "Altered-Audio-Editor-$tag-setup.exe.sig") } else { Write-Warning "No .sig file next to the installer, so there will be no updater manifest." }
          Copy-Item src-tauri/target/release/altered-audio-editor.exe (Join-Path $portable "Altered Audio Editor.exe")
          Copy-Item LICENSE, README.md, ATTRIBUTION.md $portable
          New-Item -ItemType Directory -Force -Path (Join-Path $portable "licenses") | Out-Null
          Copy-Item docs/THIRD-PARTY-*.md (Join-Path $portable "licenses")
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath (Join-Path $out "Altered-Audio-Editor-$tag-portable.zip")
          if ("${{ steps.asio.outcome }}" -ne "success") { "ASIO build failed; this installer has no ASIO." | Set-Content (Join-Path $out "NO-ASIO.txt") }

      # An MSI for schools and managed Windows machines (installs for all users, works with
      # deployment tools). An extra: if it fails the release still ships without it.
      - name: Build MSI (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}"
          $out = Join-Path $env:RUNNER_TEMP "release"
          $more = @()
          if ("${{ steps.asio.outcome }}" -eq "success") { $more = @("--features", "asio") }
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          npm run tauri build -- --bundles msi @more
          if ($LASTEXITCODE -ne 0) { throw "The MSI build failed." }
          $ver = $tag.TrimStart("v")
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*_${ver}_*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI for version $ver in the build output." }
          Copy-Item $msi.FullName (Join-Path $out "Altered-Audio-Editor-$tag-x64.msi")

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  linux:
    name: Linux AppImage and deb (experimental)
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    # The oldest Ubuntu LTS still supported: an AppImage can only run on systems with at least the
    # glibc it was built against, so building on the newest runner locks out older distributions.
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Slow or stalled mirrors have cost whole runs: each attempt is capped, a stalled
          # connection is dropped after 30 seconds, and the later attempts use Azure's mirror.
          use_azure() {
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          }
          for attempt in 1 2 3; do
            if [ "$attempt" -ge 2 ]; then use_azure; fi
            sudo dpkg --configure -a || true
            if sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo timeout 330 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y build-essential file xdg-utils libxdo-dev libssl-dev libfuse2 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf; then
              exit 0
            fi
            echo "Attempt $attempt of 3 did not finish; trying again."
            sleep 10
          done
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      # The AppImage tools are AppImages themselves; extract-and-run means
      # they work without FUSE on the runner.
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npm run tauri build -- --bundles appimage,deb --features pure-aac

      - name: Package
        run: |
          tag="${{ env.TAG }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/Altered-Audio-Editor-$tag-x86_64.AppImage"
          # The AppImage is what the in-app updater replaces; its signature goes with it.
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig "$out/Altered-Audio-Editor-$tag-x86_64.AppImage.sig" || echo "::warning::No AppImage signature, so Linux will not update itself."
          cp src-tauri/target/release/bundle/deb/*.deb "$out/Altered-Audio-Editor-$tag-linux-amd64.deb"

      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos:
    name: macOS Apple silicon (experimental, unsigned)
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    runs-on: macos-latest
    continue-on-error: true
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # "-" means an ad hoc signature: no Apple account, no notarization.
      # Apple silicon needs at least this to run the app at all.
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bash scripts/build-mac.sh --features pure-aac

      - name: Package
        run: |
          tag="${{ env.TAG }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/dmg/*.dmg "$out/Altered-Audio-Editor-$tag-macos-arm64.dmg"
          # The archive and signature the in-app updater uses to replace the app.
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz "$out/Altered-Audio-Editor-$tag-macos-arm64.app.tar.gz" || echo "::warning::No updater archive, so this Mac will not update itself."
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig "$out/Altered-Audio-Editor-$tag-macos-arm64.app.tar.gz.sig" || true

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  # Intel Macs. Built on the Apple silicon runner by cross-compiling, so it needs no
  # Intel runner. Experimental like the other non-Windows builds: if it fails, the
  # draft still gets the rest.
  macos-intel:
    name: macOS Intel (experimental, unsigned)
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: intel

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bash scripts/build-mac.sh --target x86_64-apple-darwin --features pure-aac

      - name: Package
        run: |
          tag="${{ env.TAG }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "$out/Altered-Audio-Editor-$tag-macos-intel.dmg"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz "$out/Altered-Audio-Editor-$tag-macos-intel.app.tar.gz" || echo "::warning::No updater archive, so this Mac will not update itself."
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig "$out/Altered-Audio-Editor-$tag-macos-intel.app.tar.gz.sig" || true

      - uses: actions/upload-artifact@v6
        with:
          name: macos-intel
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [verify, windows, linux, macos, macos-intel]
    # Runs when Windows built, whatever happened to Linux and macOS.
    if: always() && needs.verify.outputs.proceed == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: docs
      - uses: actions/download-artifact@v7
        with:
          path: files
          merge-multiple: true

      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ env.TAG }}"
          cd files
          no_asio=0
          if [ -f NO-ASIO.txt ]; then no_asio=1; echo "::warning::The ASIO build failed; the Windows installer has no ASIO."; rm NO-ASIO.txt; fi
          # The manifest the in-app updater reads. Windows is required; each other platform is
          # listed only when its file and signature both built.
          setup="Altered-Audio-Editor-$tag-setup.exe"
          base="https://github.com/$GH_REPO/releases/download/$tag"
          # What changed: this version's release notes from the repo, shown in the update dialog and on the release page.
          notesfile="../src/docs/release-notes-${tag#v}.md"
          if [ -f "$notesfile" ]; then cp "$notesfile" ../notes.md; else echo "See the release page for what changed." > ../notes.md; fi
          # The release page text. It carries a plain warning when ASIO did not build; the updater notes above do not.
          cp ../notes.md ../body.md
          if [ "$no_asio" = 1 ]; then
            { echo "> **No ASIO in this build.** The ASIO build step failed, so ASIO is greyed out in the Windows installer and portable zip. Check the Release run before you publish."; echo; cat ../notes.md; } > ../body.md
          fi
          if [ -f "$setup.sig" ]; then
            platforms=$(jq -n --arg sig "$(cat "$setup.sig")" --arg url "$base/$setup" '{"windows-x86_64": {signature: $sig, url: $url}}')
            add_platform() {
              key="$1"; file="$2"
              if [ -f "$file" ] && [ -f "$file.sig" ]; then
                platforms=$(jq --arg k "$key" --arg sig "$(cat "$file.sig")" --arg url "$base/$file" '. + {($k): {signature: $sig, url: $url}}' <<< "$platforms")
              fi
            }
            add_platform darwin-aarch64 "Altered-Audio-Editor-$tag-macos-arm64.app.tar.gz"
            add_platform darwin-x86_64 "Altered-Audio-Editor-$tag-macos-intel.app.tar.gz"
            add_platform linux-x86_64 "Altered-Audio-Editor-$tag-x86_64.AppImage"
            jq -n --rawfile notes ../notes.md --arg version "${tag#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
            jq '.platforms | keys' latest.json
          else
            echo "::warning::No installer signature, so no latest.json: the in-app updater will not see this release."
          fi
          sha256sum * > SHA256SUMS.txt
          ls -la
          if [ -f "$notesfile" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Altered Audio Editor $tag" --notes-file ../body.md ./*
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Altered Audio Editor $tag" --generate-notes ./*
          fi
