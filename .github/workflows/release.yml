# Builds the Windows installer and a portable zip when a version tag is
# pushed (git tag v0.1.0 && git push origin v0.1.0). It makes a DRAFT
# release, so nothing is public until you review and publish it. Publishing
# makes it the Latest release, which is where the in-app updater looks.
# Each platform builds in its own job and hands its files over as a build
# artifact; the last job makes the draft with everything that built.
# Linux and macOS are experimental: if one fails, the draft still gets
# the Windows files. The macOS build is not signed or notarized (no Apple
# developer account). Files are staged in the runner's temp folder, never
# in the repository, so nothing old from the checkout can slip in.
# The first job checks that the tag matches the version in the files, so a tag
# made before the version bump stops here instead of shipping the old version.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches the version in the files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the tag
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

  windows:
    name: Windows installer and portable zip
    needs: verify
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # ASIO needs LLVM (preinstalled on the runner) and the ASIO SDK,
      # which cpal's build script downloads. If that build fails, the
      # release still ships without ASIO.
      - name: Build installer (with ASIO)
        id: asio
        continue-on-error: true
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run tauri build -- --features asio

      - name: Build installer (without ASIO)
        if: steps.asio.outcome != 'success'
        run: npm run tauri build

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = Join-Path $env:RUNNER_TEMP "release"
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $out, $portable | Out-Null
          # Only the installer for this tag's version. An older one left in the build cache
          # must never be packaged under a new tag.
          $ver = $tag.TrimStart("v")
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${ver}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer for version $ver in the build output, so the build does not carry this version." }
          Copy-Item $setup.FullName (Join-Path $out "Altered-Audio-Editor-$tag-setup.exe")
          # The signature the in-app updater checks (made because createUpdaterArtifacts is on).
          $sig = "$($setup.FullName).sig"
          if (Test-Path $sig) { Copy-Item $sig (Join-Path $out "Altered-Audio-Editor-$tag-setup.exe.sig") } else { Write-Warning "No .sig file next to the installer, so there will be no updater manifest." }
          Copy-Item src-tauri/target/release/altered-audio-editor.exe (Join-Path $portable "Altered Audio Editor.exe")
          Copy-Item LICENSE, README.md $portable
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath (Join-Path $out "Altered-Audio-Editor-$tag-portable.zip")
          if ("${{ steps.asio.outcome }}" -ne "success") { "ASIO build failed; this installer has no ASIO." | Set-Content (Join-Path $out "NO-ASIO.txt") }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  linux:
    name: Linux AppImage and deb (experimental)
    needs: verify
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file xdg-utils libxdo-dev libssl-dev libfuse2t64 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # The AppImage tools are AppImages themselves; extract-and-run means
      # they work without FUSE on the runner.
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npm run tauri build -- --bundles appimage,deb

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/Altered-Audio-Editor-$tag-linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "$out/Altered-Audio-Editor-$tag-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos:
    name: macOS Apple silicon (experimental, unsigned)
    needs: verify
    runs-on: macos-latest
    continue-on-error: true
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # "-" means an ad hoc signature: no Apple account, no notarization.
      # Apple silicon needs at least this to run the app at all.
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles app,dmg

      - name: Package
        run: |
          tag="${{ github.ref_name }}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/dmg/*.dmg "$out/Altered-Audio-Editor-$tag-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [windows, linux, macos]
    # Runs when Windows built, whatever happened to Linux and macOS.
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: docs
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          cd files
          if [ -f NO-ASIO.txt ]; then echo "::warning::The ASIO build failed; the Windows installer has no ASIO."; rm NO-ASIO.txt; fi
          # The manifest the in-app updater reads (Windows only: the other builds are experimental).
          setup="Altered-Audio-Editor-$tag-setup.exe"
          # What changed: this version's release notes from the repo, shown in the update dialog and on the release page.
          notesfile="../src/docs/release-notes-${tag#v}.md"
          if [ -f "$notesfile" ]; then cp "$notesfile" ../notes.md; else echo "See the release page for what changed." > ../notes.md; fi
          if [ -f "$setup.sig" ]; then
            jq -n --rawfile notes ../notes.md --arg version "${tag#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sig "$(cat "$setup.sig")" --arg url "https://github.com/$GH_REPO/releases/download/$tag/$setup" '{version: $version, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          else
            echo "::warning::No installer signature, so no latest.json: the in-app updater will not see this release."
          fi
          sha256sum * > SHA256SUMS.txt
          ls -la
          if [ -f "$notesfile" ]; then
            gh release create "$tag" --draft --title "Altered Audio Editor $tag" --notes-file ../notes.md ./*
          else
            gh release create "$tag" --draft --title "Altered Audio Editor $tag" --generate-notes ./*
          fi
