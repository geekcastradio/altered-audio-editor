# cargo audit settings, read when `cargo audit` runs inside src-tauri (as CI does).
# These three zip advisories hit zip 4.6.1, pulled in only by tauri-plugin-updater.
# Our own code uses zip 9.x. The updater checks the minisign signature before it
# unpacks anything and only fetches from this project's releases.
# REMOVE when tauri-plugin-updater moves to zip 9 or later.
[advisories]
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]
